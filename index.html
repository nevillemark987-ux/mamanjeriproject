<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu & Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menu table -->
    <table>
        <caption>Menu</caption>
        <thead>
            <tr>
                <th>Dish</th>
                <th>Price</th>
                <th>Sample Image</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Pilau</td>
                <td>Ksh: 350</td>
                <td><img src="https://tse3.mm.bing.net/th/id/OIP.NQmL_HZDdNSeQOvKmgtqkwHaLH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Pilau"></td>
            </tr>
            <tr>
                <td>Ugali & Sukuma</td>
                <td>Ksh: 250</td>
                <td><img src="https://tse1.mm.bing.net/th/id/OIP.0IX_UODj2jrUWBKk6lhPqQHaE4?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Ugali and Sukuma"></td>
            </tr>
            <tr>
                <td>Chapati (2)</td>
                <td>Ksh: 100</td>
                <td><img src="https://tse2.mm.bing.net/th/id/OIP.-yHElyXI0Q6I33329OtwMQHaE8?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Chapati"></td>
            </tr>
        </tbody>
    </table>

    <!-- Registration form -->
    <form>
        <fieldset>
            <legend>Student Registration Form</legend>

            <label for="firstName">First Name</label>
            <input type="text" name="firstName" id="firstName" placeholder="First Name" required>

            <br><br>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter your Password" required>
        </fieldset>
    </form>

</body>
</html>
